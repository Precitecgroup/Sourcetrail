name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows (vcpkg-release)
    # windows-2022 still provides a large secondary disk for the workspace.
    # windows-2025 / windows-latest often only have ~14–33 GB free, which is
    # not enough for a cold LLVM+Qt vcpkg build.
    runs-on: windows-2022
    # Cold vcpkg builds (especially LLVM) can take several hours.
    timeout-minutes: 360

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      # Build only Release packages (halves LLVM/Qt disk vs debug+release).
      VCPKG_BUILD_TYPE: release
      BUILD_DIR: ${{ github.workspace }}/build/vcpkg-release

    steps:
      - name: Enable Git symlinks
        run: git config --global core.symlinks true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with MSVC tools was not found"
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvarsall.bat not found at $vcvars"
          }

          Write-Host "Using Visual Studio at $vsPath"

          # Capture the MSVC environment from vcvarsall and persist it for later steps.
          $output = cmd /c "`"$vcvars`" x64 && set"
          foreach ($line in $output) {
            if ($line -match "^(.*?)=(.*)$") {
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }

          Write-Host "MSVC environment configured"

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "vcpkg/vcpkg.exe")) {
            & .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }

      - name: Configure
        shell: pwsh
        # C++ only: skip Java indexer (no JDK/Maven/java_indexer).
        run: >
          cmake --preset vcpkg-release
          -B "$env:BUILD_DIR"
          -DBUILD_JAVA_LANGUAGE_PACKAGE=OFF

      - name: Build
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --parallel

      - name: Package
        shell: pwsh
        working-directory: ${{ env.BUILD_DIR }}
        run: cpack -G ZIP

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: Sourcetrail-Windows-x64
          path: ${{ env.BUILD_DIR }}/Sourcetrail-*.zip
          if-no-files-found: error
