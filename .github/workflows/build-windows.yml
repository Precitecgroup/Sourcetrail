name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows (vcpkg-release)
    # windows-2022 still provides a large secondary disk for the workspace.
    # windows-2025 / windows-latest often only have ~14–33 GB free, which is
    # not enough for a cold LLVM+Qt vcpkg build.
    runs-on: windows-2022
    # Cold vcpkg builds (especially LLVM) can take several hours.
    timeout-minutes: 360

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      BUILD_DIR: ${{ github.workspace }}/build/vcpkg-release

    steps:
      - name: Enable Git symlinks
        run: git config --global core.symlinks true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Free disk space
        shell: pwsh
        run: |
          Write-Host "=== Disk space before cleanup ==="
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

          $paths = @(
            "$env:ProgramFiles\Android",
            "$env:ProgramFiles (x86)\Android",
            "$env:ProgramFiles\Unity",
            "$env:ProgramFiles\Microsoft\AzureFunctionsCoreTools",
            "$env:ProgramFiles\Microsoft SQL Server",
            "$env:ProgramFiles (x86)\Microsoft SQL Server",
            "$env:ProgramFiles\dotnet\sdk\8.*",
            "$env:ProgramFiles\dotnet\sdk\7.*",
            "$env:ProgramFiles\dotnet\sdk\6.*",
            "$env:ProgramFiles (x86)\Microsoft Visual Studio\2019",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\TeamFoundation",
            "$env:ProgramData\Microsoft\VisualStudio\Packages",
            "C:\hostedtoolcache\windows\CodeQL",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\Python"
          )
          foreach ($path in $paths) {
            Get-Item -Path $path -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Removing $($_.FullName)"
              Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          if (Get-Command docker -ErrorAction SilentlyContinue) {
            docker system prune -af 2>$null
          }

          Write-Host "=== Disk space after cleanup ==="
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "vcpkg/vcpkg.exe")) {
            & .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }

      - name: Configure
        shell: pwsh
        # C++ only: skip Java indexer (no JDK/Maven/java_indexer).
        # Release-only triplet halves LLVM/Qt disk use vs debug+release.
        run: >
          cmake --preset vcpkg-release
          -B "$env:BUILD_DIR"
          -DVCPKG_TARGET_TRIPLET=ci-windows-static-md
          -DBUILD_JAVA_LANGUAGE_PACKAGE=OFF

      - name: Build
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --parallel

      - name: Package
        shell: pwsh
        working-directory: ${{ env.BUILD_DIR }}
        run: cpack -G ZIP

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: Sourcetrail-Windows-x64
          path: ${{ env.BUILD_DIR }}/Sourcetrail-*.zip
          if-no-files-found: error
